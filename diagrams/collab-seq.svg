<svg viewBox="0 0 1000 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="collab-seq-title collab-seq-desc">
      <title id="collab-seq-title">第一轮协作时序（C1~C8）</title>
      <desc id="collab-seq-desc">时序图分三个阶段展示第一轮协作：B 侧起草与审核、A 侧验收与沉淀、双向归档闭环。消息按 01 至 12 编号，自上而下即时间顺序。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 生命线 -->
      <line x1="140" y1="72" x2="140" y2="772" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="72" x2="320" y2="772" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="72" x2="500" y2="772" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="72" x2="680" y2="772" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="860" y1="72" x2="860" y2="772" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- 激活条 -->
      <rect x="136" y="124" width="8" height="284" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="856" y="574" width="8" height="74" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- 阶段分隔线 -->
      <line x1="60" y1="420" x2="940" y2="420" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <line x1="60" y1="656" x2="940" y2="656" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>

      <!-- 阶段标题 -->
      <text x="76" y="110" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.08em">阶段 1 · B 侧起草与审核 —— C1~C4</text>
      <text x="76" y="440" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.08em">阶段 2 · A 侧验收与决策沉淀 —— C5~C7</text>
      <text x="76" y="676" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.08em">阶段 3 · 双向归档，闭环 —— C8</text>

      <!-- ===== 阶段 1 ===== -->
      <!-- 01 B的AI → R pull -->
      <path d="M148,136 L492,136" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="272" y="114" width="76" height="14" rx="2" fill="#f5f5f5"/>
      <text x="310" y="125" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">01 · PULL</text>

      <!-- 02 B的AI 自环 起草 -->
      <path d="M140,184 L104,184 L104,212 L132,212" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <text x="152" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">02 · 起草方案 v1 → drafts/</text>

      <!-- 03 B（人）自环 审核（裁决点①） -->
      <path d="M320,252 L284,252 L284,280 L312,280" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="332" y="264" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">03 · 审核通过 · 裁决点①</text>

      <!-- 04 B的AI 自环 转生效 -->
      <path d="M140,320 L104,320 L104,348 L132,348" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <text x="152" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">04 · 转入 deliverables 生效</text>

      <!-- 05 B的AI → R push -->
      <path d="M148,396 L492,396" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="252" y="374" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="310" y="385" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">05 · PUSH b069da3</text>

      <!-- ===== 阶段 2 ===== -->
      <!-- 06 A（人）← R pull -->
      <path d="M672,470 L508,470" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="536" y="448" width="76" height="14" rx="2" fill="#f5f5f5"/>
      <text x="574" y="459" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">06 · PULL</text>

      <!-- 07 A（人）自环 验收（裁决点②） -->
      <path d="M680,518 L644,518 L644,546 L672,546" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="692" y="530" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.04em">07 · 验收通过 · 裁决点②</text>

      <!-- 08 A的AI 自环 回执+沉淀 -->
      <path d="M860,586 L824,586 L824,614 L852,614" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <text x="812" y="598" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">08 · 验收回执 + 决策沉淀</text>

      <!-- 09 A的AI → R push -->
      <path d="M852,632 L508,632" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="548" y="610" width="104" height="14" rx="2" fill="#f5f5f5"/>
      <text x="600" y="621" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">09 · PUSH 7215515</text>

      <!-- ===== 阶段 3 ===== -->
      <!-- 10 B的AI ← R pull 收回执 -->
      <path d="M508,704 L148,704" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="157" y="682" width="150" height="14" rx="2" fill="#f5f5f5"/>
      <text x="232" y="693" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">10 · PULL · 收验收回执</text>

      <!-- 11 B的AI → R push 归档 -->
      <path d="M148,732 L492,732" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="187" y="710" width="90" height="14" rx="2" fill="#f5f5f5"/>
      <text x="232" y="721" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">11 · PUSH 0f33bf3</text>

      <!-- 12 A的AI → R push 归档 -->
      <path d="M852,760 L508,760" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <rect x="585" y="738" width="90" height="14" rx="2" fill="#f5f5f5"/>
      <text x="630" y="749" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">12 · PUSH e8186f8</text>

      <!-- 参与者框（最后画） -->
      <rect x="76" y="24" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B 的 AI</text>
      <text x="140" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workspace-B</text>

      <rect x="256" y="24" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B（人）</text>
      <text x="320" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">H-ungry</text>

      <rect x="436" y="24" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">远程仓库</text>
      <text x="500" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub</text>

      <rect x="616" y="24" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="680" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A（人）</text>
      <text x="680" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">H-hungry</text>

      <rect x="796" y="24" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A 的 AI</text>
      <text x="860" y="62" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workspace-A</text>

      <!-- 图例 -->
      <line x1="80" y1="800" x2="920" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <path d="M196,820 L216,820" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#arrow-accent)"/>
      <text x="228" y="824" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">人工裁决（人拍板）</text>
      <path d="M388,820 L408,820" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <text x="420" y="824" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">git / 文件动作</text>
      <path d="M556,828 L540,828 L540,812 L554,812" stroke="#4f5d75" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
      <text x="576" y="824" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">本地自环动作</text>
      <text x="700" y="824" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">编号 01~12 即时间顺序</text>
    </svg>