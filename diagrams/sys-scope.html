<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台的区域与权限范围</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · Diagram Design</p>
    <h1>工作台的区域与权限范围</h1>

    <svg viewBox="0 0 1000 644" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sys-scope-title sys-scope-desc">
      <title id="sys-scope-title">工作台的区域与权限范围</title>
      <desc id="sys-scope-desc">嵌套图展示 Git 仓库内的权限层级：仓库人人可读，成员区仅本人可写，inbox 是他人唯一可写入口；commons 与 logs 与成员区平级。</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- 顶层兄弟区域：commons / logs -->
      <rect x="80" y="40" width="392" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="96" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">commons/ 公共区</text>
      <text x="96" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">契约 + 共识 · 修改须回执知会全员</text>

      <rect x="528" y="40" width="392" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="544" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">logs/ 日志区</text>
      <text x="544" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">只追加 · 禁修改删除历史</text>

      <!-- 外环：Git 仓库 -->
      <rect x="80" y="140" width="840" height="400" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <rect x="104" y="132" width="304" height="16" fill="#f5f5f5"/>
      <text x="112" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIT 仓库 · 人人可完整检出（读）</text>

      <!-- 中环：成员区 -->
      <rect x="112" y="188" width="776" height="316" rx="8" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="136" y="180" width="360" height="16" fill="#f5f5f5"/>
      <text x="144" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MEMBERS/&lt;成员&gt;/ 成员区 · 本人工作范围（写）</text>

      <!-- 内环：inbox（焦点） -->
      <rect x="144" y="236" width="712" height="232" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="168" y="228" width="256" height="16" fill="#f5f5f5"/>
      <text x="176" y="240" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">INBOX/ · 他人唯一可写入口</text>

      <!-- 内环里的五件套 -->
      <rect x="168" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="228" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">inbox/</text>
      <text x="228" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">任务·回执·异议</text>

      <rect x="304" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="364" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">drafts/</text>
      <text x="364" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AI 草稿</text>

      <rect x="440" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="500" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">deliverables/</text>
      <text x="500" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">生效唯一版本</text>

      <rect x="576" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="636" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">archive/</text>
      <text x="636" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">历史与闭环</text>

      <rect x="712" y="300" width="120" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="772" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">workspace.md</text>
      <text x="772" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">分步计划</text>

      <text x="500" y="428" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">草稿审核后才生效，生效区永远只有唯一版本，闭环即归档</text>

      <!-- 图例 -->
      <line x1="80" y1="592" x2="920" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="180" y="606" width="12" height="12" rx="2" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
      <text x="200" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">仓库 = 人人可读</text>
      <rect x="360" y="606" width="12" height="12" rx="2" fill="rgba(45,49,66,0.025)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">成员区 = 本人可写</text>
      <rect x="548" y="606" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="568" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">inbox = 他人唯一写入口</text>
    </svg>
  </div>
</body>
</html>
