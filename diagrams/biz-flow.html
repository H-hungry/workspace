<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一次任务的业务流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>一次任务的业务流程</h1>

    <svg viewBox="0 0 1000 1064" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="biz-flow-title biz-flow-desc">
      <title id="biz-flow-title">一次任务的业务流程</title>
      <desc id="biz-flow-desc">流程图展示任务从投递到闭环的完整流转：两次人工裁决（B 审核与 A 验收）卡在起草后与回执后，不通过则修订或触发新版本，通过则闭环归档。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== 箭头先画 ===== -->
      <!-- S → N2 -->
      <path d="M500,72 L500,112" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <!-- N2 → D1 -->
      <path d="M500,168 L500,204" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <!-- D1 是 → N4 -->
      <path d="M500,320 L500,356" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="486" y="328" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">是</text>
      <!-- D1 否 → 左侧上行回 N2（异议退回） -->
      <path d="M360,264 L172,264 Q160,264 160,252 L160,152 Q160,140 172,140 L380,140" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="196" y="240" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">否 · 异议退回</text>
      <!-- N4 → D2 -->
      <path d="M500,424 L500,456" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <!-- D2 通过 → N6 -->
      <path d="M500,576 L500,616" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="472" y="584" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="594" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">通过</text>
      <!-- D2 不通过 → 右侧上行回 N4 右缘上 attach(y=392) -->
      <path d="M640,512 L836,512 Q848,512 848,500 L848,404 Q848,392 836,392 L628,392" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="656" y="488" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="694" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">不通过·修订</text>
      <!-- N6 → N7 -->
      <path d="M500,672 L500,712" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <!-- N7 → D3 -->
      <path d="M500,768 L500,808" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <!-- D3 通过 → S2 -->
      <path d="M500,920 L500,960" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="472" y="928" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="938" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">通过</text>
      <!-- D3 修改要求 → 右侧上行回 N4 右缘下 attach(y=408)，走 x=872 避让 -->
      <path d="M640,864 L860,864 Q872,864 872,852 L872,420 Q872,408 860,408 L628,408" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="668" y="840" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="732" y="850" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">修改要求·触发 vN+1</text>

      <!-- ===== 节点后画 ===== -->
      <!-- S 开始 -->
      <rect x="416" y="24" width="168" height="48" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A 产生需求</text>

      <!-- N2 -->
      <rect x="380" y="112" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A 投递任务至 B 的 inbox</text>
      <text x="500" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">YYYYMMDD-任务名.md</text>

      <!-- D1 -->
      <polygon points="500,204 640,260 500,316 360,260" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B 认可任务？</text>

      <!-- N4 -->
      <rect x="372" y="356" width="256" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B 的 AI 起草方案</text>
      <text x="500" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drafts/任务名-vN.md</text>

      <!-- D2 焦点① -->
      <polygon points="500,456 640,512 500,568 360,512" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B 人工审核</text>
      <text x="500" y="526" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">裁决点①</text>

      <!-- N6 -->
      <rect x="380" y="616" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="640" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">转入 deliverables/ 生效</text>
      <text x="500" y="658" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">生效唯一版本</text>

      <!-- N7 -->
      <rect x="380" y="712" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="736" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">B 投递回执 → A</text>
      <text x="500" y="754" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">YYYYMMDD-re-任务名.md</text>

      <!-- D3 焦点② -->
      <polygon points="500,808 640,864 500,920 360,864" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A 人工验收</text>
      <text x="500" y="878" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">裁决点②</text>

      <!-- S2 结束 -->
      <rect x="404" y="960" width="192" height="48" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="500" y="982" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">任务闭环 done</text>
      <text x="500" y="998" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">双方归档 · 日志登记</text>

      <!-- 图例 -->
      <line x1="80" y1="1024" x2="920" y2="1024" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="1048" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="180" y="1038" width="20" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="208" y="1048" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">起止</text>
      <rect x="268" y="1038" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="296" y="1048" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">动作</text>
      <polygon points="388,1038 400,1044 388,1050 376,1044" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="410" y="1048" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">人工裁决点（人拍板，AI 只能建议）</text>
      <text x="700" y="1048" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">异议与 v2 走左侧/右侧回路</text>
    </svg>
  </div>
</body>
</html>
